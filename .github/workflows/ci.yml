name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parser and state-derivation tests
        run: python3 tests/test_parsers.py
      - name: Bar and popup formatting tests
        run: node tests/test_format.mjs
